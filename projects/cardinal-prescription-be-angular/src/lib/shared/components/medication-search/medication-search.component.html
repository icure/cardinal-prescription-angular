<div class="medicationSearch">
  <div
    [class.dropdownDisplayed]="dropdownDisplayed"
    class="medicationSearch__input">
    <p>{{ t('medication.search.label') }}:</p>
    <label for="medicationSearch">
      <input
        #inputRef
        id="medicationSearch"
        type="text"
        placeholder="{{ t('medication.search.label') }}"
        autocomplete="off"
        autocapitalize="off"
        [formControl]="searchControl" />
      <cardinal-search-icn color="#9CA8B2" />
    </label>
    <p class="error" *ngIf="showSearchError">
      {{ t('medication.search.errorMessage') }}
    </p>
  </div>
  <div class="results">
    <div class="spinner" *ngIf="showSpinner">
      <cardinal-spinner />
    </div>

    <div
      #medicationSearchDropdown
      *ngIf="pages && pages.length > 0"
      class="medicationSearchDropdown"
      (keydown)="handleKeyDown($event)">
      <div
        *ngFor="let med of pages; let i = index"
        class="medicationSearchDropdown__medOrProdWrap">
        <cardinal-medication-product-title
          *ngIf="med.product"
          [productTitle]="med.product?.title ?? 'error'" />
        <div
          #resultRef
          class="medicationSearchDropdown__cardWrap"
          *ngFor="let smed of med.medications; let j = index"
          [class.focused]="
            focusedSubMedicationIndex === j && focusedMedicationIndex === i
          "
          [class.subMedication]="!!med.product">
          <cardinal-medication-card
            class="medication-card"
            [medication]="smed"
            [index]="j"
            [subMedication]="!!med.product"
            [focused]="
              focusedSubMedicationIndex === j && focusedMedicationIndex === i
            "
            (addPrescription)="handleAddPrescription($event)" />
        </div>
      </div>

      <div #scrollAnchor style="height: 1px"></div>
    </div>

    <div class="placeholder" *ngIf="showNoMatchesPlaceholder">
      <p>
        {{ t('medication.search.noMatchingPlaceholder') }}
      </p>
    </div>
  </div>
</div>
